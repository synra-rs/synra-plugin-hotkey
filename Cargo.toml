[package]
name = "synra-plugin-hotkey"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = [ "imba97 <mail@imba97.cn>" ]
repository = "https://github.com/synra-rs/synra-plugin-hotkey"
description = "Phone hotkey panel for Synra"
publish = false

[package.metadata.synra.ui]
source = "ui/dist"
directory = "."
command = [
  "pnpm",
  "run",
  "build"
]

[lib]
crate-type = [
  "cdylib",
  "rlib"
]

[dependencies]
synra-plugin-sdk = { git = "https://github.com/synra-rs/synra-core.git", rev = "ffec0a2dd3833346bccc6f75bb49447c4e2cc9eb" }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
