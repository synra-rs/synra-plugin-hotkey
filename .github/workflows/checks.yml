name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SYNRA_CORE_REVISION: ffec0a2dd3833346bccc6f75bb49447c4e2cc9eb

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm test
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Check SDK and CLI revision alignment
        run: |
          sdk_source=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].dependencies[] | select(.name == "synra-plugin-sdk") | .source')
          test "$sdk_source" = "git+https://github.com/synra-rs/synra-core.git?rev=$SYNRA_CORE_REVISION"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching author CLI
        run: cargo install synra-plugin-cli --git https://github.com/synra-rs/synra-core.git --rev "$SYNRA_CORE_REVISION" --locked
      - name: Build and verify actual Wasm component
        run: |
          synra-plugin build
          synra-plugin verify --dir dist
          git diff --exit-code -- Cargo.lock

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.88.0 check --locked --all-targets
      - run: cargo +1.88.0 check --locked --target wasm32-unknown-unknown
